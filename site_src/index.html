<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AoIR Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0c0c">
<meta name="description" content="Browse AoIR merch and scan to check out on your phone.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0c0c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%237EBEC5'/%3E%3C/svg%3E">
<link rel="preload" as="font" type="font/woff2" href="fonts/archivo-400-700-latin.woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="bar">
    <!-- Lockup after the AoIR mark: node, rule, wordmark, divider, stacked caps. -->
    <button class="identity" id="home" aria-label="All products">
      <span class="node" aria-hidden="true"></span>
      <span class="lead" aria-hidden="true"></span>
      <span class="wordmark">a(o).i.r</span>
      <span class="divider" aria-hidden="true"></span>
      <span class="org">Association&nbsp;of<br>Internet&nbsp;Researchers</span>
    </button>

    <div class="tools">
      <div class="field" id="searchWrap">
        <input id="q" type="search" placeholder="SEARCH" autocomplete="off"
               autocorrect="off" autocapitalize="off" spellcheck="false"
               enterkeyhint="search" aria-label="Search products">
        <button class="clear" id="clearQ" aria-label="Clear search">✕</button>
      </div>
      <div class="field select">
        <select id="sort" aria-label="Sort products">
          <option value="featured">Featured</option>
          <option value="price-asc">Price ↑</option>
          <option value="price-desc">Price ↓</option>
          <option value="name">A–Z</option>
          <option value="new">Newest</option>
        </select>
      </div>
    </div>
  </div>

  <nav class="filters" id="chips" aria-label="Collections and categories"></nav>
</header>

<main>
  <div class="ledger">
    <span id="count"></span>
    <span class="dot" aria-hidden="true"></span>
    <span id="scope"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <h2>No results</h2>
    <p>Try another collection, or clear the search.</p>
  </div>
</main>

<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-top">
    <button class="back" id="back">
      <span aria-hidden="true">←</span> All products
    </button>
    <div class="crumb" id="sheetTitle"></div>
  </div>

  <div class="sheet-body" id="sheetBody">
    <div class="gal">
      <div class="plate lg"><img id="galMain" alt=""></div>
      <div class="strip" id="galStrip"></div>
    </div>

    <div class="spec">
      <div class="eyebrow"><span id="pIdx"></span><i aria-hidden="true"></i><span id="pCat"></span></div>
      <h1 id="pName"></h1>
      <p class="price" id="pPrice"></p>

      <div class="opt" id="colorOpt">
        <div class="lbl">Color <span id="colorVal"></span></div>
        <div class="swatches" id="colors"></div>
      </div>

      <div class="opt" id="sizeOpt">
        <div class="lbl">Size <span id="sizeVal"></span></div>
        <div class="sizes" id="sizes"></div>
      </div>

      <div class="qr">
        <div class="qr-plate">
          <canvas id="qr" width="260" height="260" aria-label="Checkout QR code"></canvas>
        </div>
        <div class="qr-side">
          <div class="qr-hd">Scan to<br>check out</div>
          <p class="qr-sb">Point your phone camera at the code. You'll check out on your own phone.</p>
          <div class="qr-vt" id="qrVariant"></div>
          <div class="qr-sku" id="pSku"></div>
        </div>
      </div>

      <ul class="details" id="pDetails"></ul>
    </div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
